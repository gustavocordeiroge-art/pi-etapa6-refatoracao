<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consultas - Clínica</title><link rel="stylesheet" href="css/estilo.css"></head>
<body data-pagina="consultas">
<header><h1>Clínica Saúde Integrada</h1><nav>
<a href="index.html" >Início</a><a href="pacientes.html" >Pacientes</a><a href="consultas.html" class="ativo">Consultas</a></nav></header>
<main>
<section class="card"><h2>Agendar consulta</h2><div id="aviso" role="status"></div>
<form id="formConsulta" class="grid" novalidate>
<label>Paciente<select name="paciente"></select><span class="erro"></span></label>
<label>Data e hora<input name="dataHora" type="datetime-local"><span class="erro"></span></label>
<label>Especialidade<select name="especialidade"><option value="">Selecione</option><option>Clínica Geral</option><option>Cardiologia</option><option>Pediatria</option><option>Dermatologia</option></select><span class="erro"></span></label>
<div class="acoes"><button type="submit">Agendar</button></div>
</form></section>
<section class="card"><h2>Consultas</h2>
<table id="tabela"><thead><tr><th>Paciente</th><th>Data/hora</th><th>Especialidade</th><th>Status</th><th>Ações</th></tr></thead><tbody></tbody></table></section>
</main><script src="js/validacoes.js"></script><script src="js/app.js"></script></body></html>
